  <text x="340" y="177" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#EDEDED">pitch &#183; badges &#183; config</text>
  <text x="656" y="177" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6C6C74">front door</text>

  <!-- HIGH -->
  <rect x="40" y="230" width="640" height="74" rx="10" fill="#2A1214"/>
