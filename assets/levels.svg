<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="the three readme-pro intensity levels">
  <rect width="720" height="340" rx="12" fill="#191919"/>

  <!-- LOW -->
