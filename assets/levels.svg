  <text x="150" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#EDEDED">what it does &#183; install &#183; example</text>
  <text x="656" y="78" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#6C6C74">60 s read</text>

  <!-- MEDIUM -->
